name: Compilar y Publicar APK en GitHub Releases

on:
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente al subir una etiqueta como v1.2.0
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      # Si google-services.json está en .gitignore, lo restaura desde los Secretos de GitHub
      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      # Restaurar el debug.keystore de tu PC para que el APK compilado en GitHub Actions
      # tenga exactamente la misma firma que el APK que ya instalaste desde Android Studio
      - name: Restaurar debug.keystore (Firma idéntica a tu PC)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          fi

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar Release con APK en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
