name: Compilar y Publicar APK en GitHub Releases



on:

  push:

    branches:

      - master

      - main

    tags:

      - 'v*'

  workflow_dispatch:



permissions:

  contents: write



jobs:

  build:

    name: Compilar APK Android

    runs-on: ubuntu-latest



    steps:

      - name: Clonar repositorio

        uses: actions/checkout@v4



      - name: Configurar Java 21

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '21'



      - name: Dar permisos de ejecucion a gradlew

        run: chmod +x gradlew



      - name: Crear google-services.json desde Secreto

        env:

          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

        run: |

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then

            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

          else

            echo "ERROR: Falta configurar el secreto GOOGLE_SERVICES_JSON en Settings > Secrets and variables > Actions"

            exit 1

          fi



      - name: Usar la misma firma de Android Studio (debug.keystore)

        env:

          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

        run: |

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then

            mkdir -p ~/.android

            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

          fi



      - name: Incrementar version automaticamente segun el numero de envio

        run: |

          NEW_CODE=$((100 + ${{ github.run_number }}))

          NEW_NAME="2.0.${{ github.run_number }}"

          sed -i "s/versionCode = [0-9]*/versionCode = $NEW_CODE/g" app/build.gradle.kts

          sed -i "s/versionName = \".*\"/versionName = \"$NEW_NAME\"/g" app/build.gradle.kts

          echo "TAG_VERSION=v$NEW_NAME" >> $GITHUB_ENV



      - name: Compilar APK Debug

        run: ./gradlew assembleDebug --no-daemon



      - name: Publicar Release Automatico con APK

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ env.TAG_VERSION }}

          name: "CampusConnect ${{ env.TAG_VERSION }}"

          body: "Actualizacion automatica generada del commit: ${{ github.event.head_commit.message }}"

          files: app/build/outputs/apk/debug/app-debug.apk

          prerelease: false

          make_latest: true

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
